name: Deploy to Firebase Hosting from firebaseHosting
on:
  push:
    branches:
      - firebaseHosting
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KUJIAPP_PRIVACYPOLICY }}
          projectId: kujiapp-privacypolicy
